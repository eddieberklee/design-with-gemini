<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design with Gemini — Grid</title>
  <link rel="stylesheet" href="cells/decisions/decisions.css">
  <link rel="stylesheet" href="cells/prosody/prosody.css">
  <link rel="stylesheet" href="cells/motion/motion.css">
  <link rel="stylesheet" href="cells/api-matrix/api-matrix.css">
  <link rel="stylesheet" href="cells/left-grille/left-grille.css">
  <link rel="stylesheet" href="cells/grille-swipe/grille-swipe.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh;
      background: #fafafa;
      padding: clamp(16px, 3vw, 40px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      width: 100%;
      max-width: min(92vw, 1600px);
      margin-inline: auto;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    .cell {
      aspect-ratio: 4 / 3;
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main class="grid">
    <section class="cell cell--decisions cell--decisions-input" id="cell-decisions-input" aria-label="Gemini Decisions API — Step 1: Input"></section>
    <section class="cell cell--decisions cell--decisions-verdict" id="cell-decisions-verdict" aria-label="Gemini Decisions API — Step 2: Yes/No Check and Category"></section>
    <section class="cell cell--decisions cell--decisions-score" id="cell-decisions-score" aria-label="Gemini Decisions API — Step 3: Rubric Score and Zero-Token Proof"></section>
    <section class="cell cell--prosody" id="cell-prosody" aria-label="Voice Prosody Button Sizer prototype"></section>
    <section class="cell cell--motion" id="cell-motion" aria-label="iPhone Motion Grid Controller prototype"></section>
    <section class="cell cell--api-matrix" id="cell-api-matrix" aria-label="Google Gemini API Matrix"></section>
    <section class="cell cell--left-grille" id="cell-left-grille" aria-label="Left Grille Acoustic Swipe Sonar"></section>
    <section class="cell cell--grille-swipe cell-acoustic" id="cell-grille-swipe" aria-label="16-inch MacBook Pro Right Grille Acoustic Swipe Lab"></section>
    <div class="cell"></div>
  </main>

  <script defer src="cells/decisions/schema.js"></script>
  <script defer src="cells/decisions/presets.js"></script>
  <script defer src="cells/decisions/client.js"></script>
  <script defer src="cells/decisions/ui.js"></script>
  <script defer src="cells/prosody/client.js"></script>
  <script defer src="cells/prosody/ui.js"></script>
  <script defer src="cells/motion/qr.js"></script>
  <script defer src="cells/motion/physics.js"></script>
  <script defer src="cells/motion/transport.js"></script>
  <script defer src="cells/motion/ui.js"></script>
  <script defer src="cells/api-matrix/audio.js"></script>
  <script defer src="cells/api-matrix/probes.js"></script>
  <script defer src="cells/api-matrix/ui.js"></script>
  <script defer src="cells/left-grille/acoustic-engine.js"></script>
  <script defer src="cells/left-grille/acoustic-controller.js"></script>
  <script defer src="cells/left-grille/ui.js"></script>
  <script defer src="cells/grille-swipe/grille-swipe.js"></script>
</body>
</html>
