    <section class="cell cell--hand-gesture" id="cell-hand-gesture" aria-label="Webcam Hand and Spatial Gesture Cursor prototype"></section>
    <section class="cell cell--draw" id="cell-draw" aria-label="Freehand Drawing Sketchpad"></section>
    <section class="cell cell--image-gen" id="cell-image-gen" aria-label="Gemini Image Generation"></section>
    <section class="cell cell--image-to-3d" id="cell-image-to-3d" aria-label="Image to 3D 4-Model Arena"></section>
